name: Windows release assets
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.1.6
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build Windows x64 installer and portable app
        run: npx electron-builder --win --x64 --publish never
      - name: Verify packaged version
        shell: pwsh
        run: |
          $expected = '${{ inputs.tag }}'.TrimStart('v')
          $actual = (Get-Item 'release/win-unpacked/IRustPeek.exe').VersionInfo.ProductVersion
          if ($actual -ne $expected) { throw "Unexpected version: $actual" }
      - name: Upload assets to existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view '${{ inputs.tag }}' --repo '${{ github.repository }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = Get-ChildItem release -File | Where-Object { $_.Name -match '\.exe(\.blockmap)?$|^latest\.yml$' } | ForEach-Object { $_.FullName }
          if (@($assets).Count -lt 3) { throw 'Missing Windows assets' }
          gh release upload '${{ inputs.tag }}' @assets --repo '${{ github.repository }}'
          exit $LASTEXITCODE
