name: Build and release

# Branches claude/**: só compila e guarda os pacotes como artefatos do workflow.
# Tags v*: compila as três plataformas e publica uma pre-release com os pacotes
# (notas da release = mensagem da tag anotada).
on:
  push:
    branches: ['claude/**']
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build macOS universal DMG
        run: npx electron-builder --mac dmg --universal --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            release/*.dmg
            release/*.dmg.blockmap
          if-no-files-found: error

  mac-intel-login:
    # Mac Intel: a fatia x86_64 precisa de assinatura para o macOS aceitar o
    # app como item de login.
    needs: mac
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install playwright-core (only for the check)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright-core@1.49.1
      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: dmg
      - name: Login item with this build (x86_64)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          uname -m
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/irp dmg/*.dmg
          ditto /tmp/irp/IRustPeek.app "$RUNNER_TEMP/new/IRustPeek.app"
          hdiutil detach /tmp/irp
          codesign -dv --arch x86_64 "$RUNNER_TEMP/new/IRustPeek.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/new/IRustPeek.app"
          node test/mac-login-check.js "$RUNNER_TEMP/new/IRustPeek.app/Contents/MacOS/IRustPeek"
      - name: Compare with published 0.1.8 (informative)
        continue-on-error: true
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.8 --repo "$GITHUB_REPOSITORY" -p 'IRustPeek-0.1.8-universal.dmg' -D old
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/irp-old old/*.dmg
          ditto /tmp/irp-old/IRustPeek.app "$RUNNER_TEMP/old/IRustPeek.app"
          hdiutil detach /tmp/irp-old
          codesign -dv --arch x86_64 "$RUNNER_TEMP/old/IRustPeek.app" || true
          node test/mac-login-check.js "$RUNNER_TEMP/old/IRustPeek.app/Contents/MacOS/IRustPeek" --expect-fail

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build Windows x64 installer and portable app
        run: npx electron-builder --win --x64 --publish never
      - name: Verify packaged version
        shell: pwsh
        run: |
          $expected = (Get-Content package.json -Raw | ConvertFrom-Json).version + '.0'
          $actual = (Get-Item 'release/win-unpacked/IRustPeek.exe').VersionInfo.ProductVersion
          if ($actual -ne $expected) { throw "Unexpected version: $actual" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build Linux AppImage and deb (x64 + arm64)
        run: npx electron-builder --linux AppImage deb --x64 --arm64 --publish never
      - name: Inspect deb packages
        run: |
          for deb in release/*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb" | grep -E 'usr/share/applications/.*\.desktop$'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, mac-intel-login, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch annotated tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create pre-release with all packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          ( cd dist && sha256sum * > SHA256SUMS.txt )
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN PGP/,$d' > release-notes.md
          test -s release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "IRustPeek ${GITHUB_REF_NAME} — macOS, Windows e Linux" \
            --notes-file release-notes.md \
            --prerelease \
            --verify-tag
